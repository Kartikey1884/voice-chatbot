<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HRMS Chatbot Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-container {
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      width: 300px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background-color: #4CAF50;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login to HRMS Chatbot</h2>

    <form id="loginForm">
      <input type="text" name="userName" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <input type="text" name="registrationToken" placeholder="Registration Token" required />
      <button type="submit">Login</button>
      <div class="error" id="errorMsg"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault(); // Prevent default form submission

      errorMsg.textContent = ""; // Clear previous error

      const formData = new FormData(form);
      const data = {
        userName: formData.get("userName"),
        password: formData.get("password"),
        registrationToken: formData.get("registrationToken")
      };

      try {
        const response = await fetch("/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: new URLSearchParams(data)
        });

        const result = await response.json();

        // Print response in terminal
        console.log("Login Response:", result);

        if (response.ok) {
  localStorage.setItem("session_id", result.session_id);
  console.log("SESSION STORED:", result.session_id);
  window.location.href = "/chat";
} else {
          // Show error
          errorMsg.textContent = result.detail || "Login failed. Please try again.";
        }
      } catch (err) {
        console.error("Fetch error:", err);
        errorMsg.textContent = "An error occurred. Check the console.";
      }
    });
  </script>
</body>
</html>
