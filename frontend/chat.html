<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HRMS AI Assistant • Chat</title>
  <link rel="stylesheet" href="/assets/css/chat.css" />
</head>
<body>
  <div class="bg"></div>

  <main class="wrap">
    <header class="topbar">
      <div class="left">
        <div class="mark"></div>
        <div class="titles">
          <div class="title">AI Assistant</div>
          <div class="meta">
            <span class="pill" id="statusPill">● Online</span>
            <span class="muted" id="userLine"></span>
          </div>
        </div>
      </div>

      <div class="right">
        <button class="ghost" id="clearBtn">Clear</button>
        <button class="danger" id="logoutBtn">Logout</button>
      </div>
    </header>

    <section class="chatArea" id="chatArea">
      <div class="hint" id="hint">
        You are logged in. Chat will use your HRMS profile details later.
      </div>
    </section>

    <footer class="composer">
      <div class="toggle">
        <button class="seg active" id="modeChat">Chat</button>
        <button class="seg" id="modeVoice">Voice</button>
      </div>

      <div class="inputWrap">
        <input id="messageInput" type="text" placeholder="Type your message…" />
        <button id="sendBtn" disabled>Send</button>
      </div>
    </footer>
  </main>

  <script src="/assets/js/chat.js"></script>
</body>
</html>
